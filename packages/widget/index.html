<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prescription Template Widget - Demo</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px; background: #f5f5f5; }
    #widget-container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .demo-output { margin-top: 24px; padding: 16px; background: #f0f7ff; border-radius: 8px; }
    .demo-output pre { white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <h1 style="text-align:center;color:#333">Smart Prescription Widget Demo</h1>
  <div id="widget-container"></div>
  <div class="demo-output">
    <h3>Event Log</h3>
    <pre id="event-log">Waiting for events...</pre>
  </div>

  <script type="module">
    import { PrescriptionTemplateWidget } from './src/index.ts';

    const widget = new PrescriptionTemplateWidget({
      container: '#widget-container',
      apiBaseUrl: 'http://localhost:3000',
      authToken: localStorage.getItem('token') || 'demo-token',
      mode: 'full',
    });

    widget.on('template:applied', (data) => {
      document.getElementById('event-log').textContent =
        'template:applied\n' + JSON.stringify(data, null, 2);
    });

    widget.on('template:created', (data) => {
      document.getElementById('event-log').textContent =
        'template:created\n' + JSON.stringify(data, null, 2);
    });

    widget.on('error', (err) => {
      document.getElementById('event-log').textContent = 'error: ' + (err.message || JSON.stringify(err));
    });

    widget.mount();
    window._widget = widget;
  </script>
</body>
</html>
